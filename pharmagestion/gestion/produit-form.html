<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un produit · PharmaGestion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="tableau-de-bord.html">PharmaGestion · Gestion</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Ouvrir le menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="tableau-de-bord.html">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link active" href="produits.html" aria-current="page">Produits</a></li>
                    <li class="nav-item"><a class="nav-link" href="vente.html">Vente au comptoir</a></li>
                </ul>
                <span class="navbar-text text-white">Dr Ndèye Coumba Faye · <a class="text-white" href="connexion.html">Se déconnecter</a></span>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <h1 class="h2 mb-3">Modifier le produit P006</h1>
        <form class="card card-body" action="produits.html" method="post">
            <div class="row g-3">
                    <div class="col-md-3"><label for="reference" class="form-label">Référence</label><input type="text" class="form-control" id="reference" name="reference" value="P006" required></div>
                    <div class="col-md-9"><label for="nom" class="form-label">Nom</label><input type="text" class="form-control" id="nom" name="nom" value="Ibuprofène 400 mg, boîte de 20 comprimés" required></div>
                    <div class="col-md-6"><label for="categorie" class="form-label">Catégorie</label><select class="form-select" id="categorie" name="categorie"><option selected>Douleur et fièvre</option><option>Rhume et allergies</option><option>Digestion</option><option>Vitamines et compléments</option><option>Soins du visage et du corps</option><option>Hygiène</option><option>Bébé et maman</option><option>Premiers secours et prévention</option></select></div>
                    <div class="col-md-6"><label for="fournisseur" class="form-label">Fournisseur</label><select class="form-select" id="fournisseur" name="fournisseur"><option>Cofimed Afrique (fictif)</option><option>Téranga Santé Distribution (fictif)</option><option>ParaSahel (fictif)</option></select></div>
                    <div class="col-6 col-md-3"><label for="prix_achat" class="form-label">Prix d'achat (FCFA)</label><input type="number" class="form-control" id="prix_achat" name="prix_achat" value="900" required></div>
                    <div class="col-6 col-md-3"><label for="prix_vente" class="form-label">Prix de vente (FCFA)</label><input type="number" class="form-control is-invalid" id="prix_vente" name="prix_vente" value="800" required><div class="invalid-feedback">Le prix de vente doit être supérieur au prix d'achat.</div></div>
                    <div class="col-6 col-md-3"><label for="stock" class="form-label">Stock</label><input type="number" class="form-control" id="stock" name="stock" value="4" required></div>
                    <div class="col-6 col-md-3"><label for="seuil" class="form-label">Seuil d'alerte</label><input type="number" class="form-control" id="seuil" name="seuil" value="10" required></div>
                    <div class="col-md-6"><label for="date_peremption" class="form-label">Date de péremption</label><input type="date" class="form-control" id="date_peremption" name="date_peremption" value="2029-10-02" required></div>
            </div>
            <div class="mt-4"><button type="submit" class="btn btn-success">Enregistrer</button> <a href="produits.html" class="btn btn-outline-secondary">Annuler</a></div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
