<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrire un élève · eKolbi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="tableau-de-bord.html">eKolbi · Gestion</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Ouvrir le menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="tableau-de-bord.html">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link active" href="eleves.html" aria-current="page">Élèves</a></li>
                    <li class="nav-item"><a class="nav-link" href="encaissement.html">Encaisser un paiement</a></li>
                </ul>
                <span class="navbar-text text-white">M. Abdoulaye Sow, directeur · <a class="text-white" href="connexion.html">Se déconnecter</a></span>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <h1 class="h2 mb-3">Inscrire un élève</h1>
        <form class="card card-body" action="eleves.html" method="post">
            <div class="row g-3">
                    <div class="col-md-6"><label for="prenom" class="form-label">Prénom</label><input type="text" class="form-control" id="prenom" name="prenom" value="Mariama" required></div>
                    <div class="col-md-6"><label for="nom" class="form-label">Nom</label><input type="text" class="form-control is-invalid" id="nom" name="nom" required><div class="invalid-feedback">Le nom de l'élève est obligatoire.</div></div>
                    <div class="col-md-6"><label for="sexe" class="form-label">Sexe</label><select class="form-select" id="sexe" name="sexe"><option>Fille</option><option>Garçon</option></select></div>
                    <div class="col-md-6"><label for="date_naissance" class="form-label">Date de naissance</label><input type="date" class="form-control" id="date_naissance" name="date_naissance" value="2020-03-14" required></div>
                    <div class="col-md-6"><label for="classe" class="form-label">Classe</label><select class="form-select" id="classe" name="classe"><option selected>CI A</option><option>CP A</option><option>CE1 A</option><option>CE2 A</option><option>CM1 A</option><option>CM2 A</option><option>CM2 B</option><option>6e A</option><option>5e A</option><option>4e A</option><option>3e A</option><option>3e B</option></select></div>
                    <div class="col-md-6"><label for="parent" class="form-label">Parent</label><select class="form-select" id="parent" name="parent"><option>Khady Sy</option><option>Aminata Thiam</option><option>Maïmouna Diouf</option></select></div>
            </div>
            <div class="mt-4"><button type="submit" class="btn btn-primary">Enregistrer</button> <a href="eleves.html" class="btn btn-outline-secondary">Annuler</a></div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
