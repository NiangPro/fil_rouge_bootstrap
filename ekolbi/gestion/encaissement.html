<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encaisser un paiement · eKolbi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="tableau-de-bord.html">eKolbi · Gestion</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Ouvrir le menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="tableau-de-bord.html">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link" href="eleves.html">Élèves</a></li>
                    <li class="nav-item"><a class="nav-link active" href="encaissement.html" aria-current="page">Encaisser un paiement</a></li>
                </ul>
                <span class="navbar-text text-white">M. Abdoulaye Sow, directeur · <a class="text-white" href="connexion.html">Se déconnecter</a></span>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <h1 class="h2 mb-3">Encaisser un paiement</h1>
        <div class="row g-4">
            <div class="col-lg-7">
                <form class="card card-body" action="encaissement.html" method="post">
                    <div class="row g-3">
                    <div class="col-12"><label for="eleve" class="form-label">Élève</label><select class="form-select" id="eleve" name="eleve"><option>Penda Sy (CI A)</option><option>Ousmane Sy (CI A)</option><option>Abdou Ndiaye (CE1 A)</option></select></div>
                    <div class="col-md-6"><label for="type" class="form-label">Type</label><select class="form-select" id="type" name="type"><option>Mensualité</option><option>Inscription</option></select></div>
                    <div class="col-md-6"><label for="mois" class="form-label">Mois</label><select class="form-select" id="mois" name="mois"><option>Septembre 2026</option><option>Octobre 2026</option></select></div>
                    <div class="col-md-6"><label for="montant" class="form-label">Montant (FCFA)</label><input type="number" class="form-control" id="montant" name="montant" value="12500" required></div>
                    <div class="col-md-6"><label for="mode" class="form-label">Mode de paiement</label><select class="form-select" id="mode" name="mode"><option>Espèces</option><option selected>Wave</option><option>Orange Money</option></select></div>
                    </div>
                    <div class="mt-3"><button type="submit" class="btn btn-primary">Encaisser et imprimer le reçu</button></div>
                </form>
            </div>
            <div class="col-lg-5">
                <div class="card border-danger mb-3"><div class="card-body">
                    <h2 class="h5">Famille Sy (parent : Khady Sy)</h2>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">Penda Sy, CI A <span class="badge text-bg-danger">1 mois en retard</span></li>
                        <li class="list-group-item d-flex justify-content-between">Ousmane Sy, CI A <span class="badge text-bg-success">À jour</span></li>
                    </ul>
                    <p class="fw-bold mt-2 mb-0">Reste à payer : 12 500 FCFA</p>
                </div></div>
                <div class="alert alert-secondary mb-0">Prochain reçu : n° R00347</div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
